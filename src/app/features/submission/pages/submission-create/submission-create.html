<div class="page-container">
  <app-page-header
    title="New Submission"
    subtitle="Create a new insurance submission"
    icon="bi-file-earmark-plus"
    [breadcrumbs]="breadcrumbs">
  </app-page-header>

  @if (alertMsg()) {
    <div class="alert alert-{{ alertMsg()!.type }} d-flex gap-2 py-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill"></i>{{ alertMsg()!.text }}
    </div>
  }

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form [formGroup]="form" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-section">
              <div class="form-section-title">Party & Agent</div>
              <div class="mb-3">
                <label class="form-label small fw-medium required-mark">Party ID</label>
                <input type="text" class="form-control form-control-sm"
                       [class.is-invalid]="form.controls.partyId.invalid && form.controls.partyId.touched"
                       formControlName="partyId" placeholder="Enter party UUID" />
                <div class="invalid-feedback">Party ID is required.</div>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-medium required-mark">Agent ID</label>
                <input type="text" class="form-control form-control-sm"
                       [class.is-invalid]="form.controls.agentId.invalid && form.controls.agentId.touched"
                       formControlName="agentId" placeholder="Enter agent UUID" />
                <div class="invalid-feedback">Agent ID is required.</div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-section">
              <div class="form-section-title">Product Details</div>
              <div class="mb-3">
                <label class="form-label small fw-medium required-mark">Product Line</label>
                <select class="form-select form-select-sm" formControlName="productLine">
                  @for (p of productLines; track p) { <option [value]="p">{{ p }}</option> }
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-medium required-mark">Inception Date</label>
                <input type="date" class="form-control form-control-sm"
                       [class.is-invalid]="form.controls.inceptionDate.invalid && form.controls.inceptionDate.touched"
                       formControlName="inceptionDate" />
                <div class="invalid-feedback">Inception date is required.</div>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 justify-content-end border-top pt-3 mt-2">
          <a routerLink="/submissions" class="btn btn-sm btn-outline-secondary">Cancel</a>
          <button class="btn btn-sm btn-primary" (click)="save()" [disabled]="saving()">
            @if (saving()) { <span class="spinner-border spinner-border-sm me-1"></span> }
            Create Submission
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
