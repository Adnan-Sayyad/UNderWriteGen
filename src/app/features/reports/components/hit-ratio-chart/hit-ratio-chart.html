<div class="score-grid">
  @if (!data.length) {
    <p class="text-muted small text-center py-3 w-100">No hit ratio data available.</p>
  } @else {
    @for (item of data; track item.scopeValue) {
      @if (item.quotes > 0) {
      <div class="score-card">
        <div class="score-scope">{{ item.scopeValue }}</div>
        <div class="score-value" [class.text-success]="item.hitRatioPercent >= 50"
                                  [class.text-warning]="item.hitRatioPercent >= 25 && item.hitRatioPercent < 50"
                                  [class.text-danger]="item.hitRatioPercent < 25">
          {{ item.hitRatioPercent | number:'1.1-1' }}%
        </div>
        <div class="score-detail">{{ item.boundPolicies }} bound / {{ item.quotes }} quoted</div>
        <div class="score-track mt-2">
          <div class="score-fill"
               [class.bg-success]="item.hitRatioPercent >= 50"
               [class.bg-warning]="item.hitRatioPercent >= 25 && item.hitRatioPercent < 50"
               [class.bg-danger]="item.hitRatioPercent < 25"
               [style.width.%]="item.hitRatioPercent"></div>
        </div>
      </div>
      }
    }
  }
</div>
