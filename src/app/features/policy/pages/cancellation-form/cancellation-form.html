<div class="page-container">
  <app-page-header
    title="Request Cancellation"
    subtitle="Submit a policy cancellation request for review"
    icon="bi-x-circle"
    [breadcrumbs]="breadcrumbs">
  </app-page-header>

  @if (alertMsg()) {
    <div class="alert alert-{{ alertMsg()!.type }} d-flex gap-2 py-2 mb-3">
      <i class="bi" [class.bi-check-circle-fill]="alertMsg()!.type==='success'"
                    [class.bi-exclamation-triangle-fill]="alertMsg()!.type==='danger'"></i>
      {{ alertMsg()!.text }}
    </div>
  }

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <div class="alert alert-warning d-flex gap-2 py-2 mb-3">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>You are requesting cancellation for policy <strong>{{ policyId() }}</strong>. This action will be submitted for approval.</span>
      </div>
      <form [formGroup]="form" novalidate>
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label small fw-medium required-mark">Cancellation Reason</label>
            <textarea class="form-control form-control-sm" formControlName="cancelReason" rows="3"
                      [class.is-invalid]="form.controls.cancelReason.invalid && form.controls.cancelReason.touched"
                      placeholder="Explain the reason for cancellation…"></textarea>
            <div class="invalid-feedback">Cancellation reason is required.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-medium required-mark">Cancellation Date</label>
            <input type="date" class="form-control form-control-sm" formControlName="cancelDate"
                   [class.is-invalid]="form.controls.cancelDate.invalid && form.controls.cancelDate.touched" />
            <div class="invalid-feedback">Cancellation date is required.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-medium required-mark">Refund Premium ($)</label>
            <input type="number" class="form-control form-control-sm" formControlName="refundPremium"
                   min="0" placeholder="0.00" />
          </div>
        </div>
      </form>
    </div>
    <div class="card-footer bg-transparent d-flex justify-content-end gap-2">
      <button class="btn btn-outline-secondary btn-sm" (click)="cancel()">Cancel</button>
      <button class="btn btn-danger btn-sm" (click)="save()" [disabled]="saving()">
        @if (saving()) { <span class="spinner-border spinner-border-sm me-1"></span> }
        Submit Cancellation Request
      </button>
    </div>
  </div>
</div>
