<div class="page-container">
  <app-page-header
    [title]="partyId() ? 'Edit Party' : 'New Party'"
    subtitle="Manage customer / insured party details"
    icon="bi-people"
    [breadcrumbs]="breadcrumbs">
  </app-page-header>

  @if (alertMsg()) {
    <div class="alert alert-{{ alertMsg()!.type }} d-flex gap-2 py-2 mb-3">
      <i class="bi" [class.bi-check-circle-fill]="alertMsg()!.type==='success'"
                    [class.bi-exclamation-triangle-fill]="alertMsg()!.type==='danger'"></i>
      {{ alertMsg()!.text }}
    </div>
  }

  @if (loading()) {
    <div class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</div>
  } @else {
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form [formGroup]="form" novalidate>
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label small fw-medium required-mark">Full Name / Company Name</label>
              <input type="text" class="form-control form-control-sm" formControlName="name"
                     [class.is-invalid]="form.controls.name.invalid && form.controls.name.touched" />
              <div class="invalid-feedback">Name is required.</div>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-medium">Status</label>
              <select class="form-select form-select-sm" formControlName="status">
                @for (s of statuses; track s) { <option [value]="s">{{ s }}</option> }
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-medium required-mark">Party Type</label>
              <select class="form-select form-select-sm" formControlName="partyType">
                @for (t of partyTypes; track t) { <option [value]="t">{{ t }}</option> }
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-medium required-mark">Segment</label>
              <select class="form-select form-select-sm" formControlName="segment">
                @for (s of segments; track s) { <option [value]="s">{{ s }}</option> }
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-medium">DOB / Incorporation Date</label>
              <input type="date" class="form-control form-control-sm" formControlName="dobIncorporation" />
            </div>

            <div class="col-12"><hr class="my-1" /><p class="small fw-semibold text-muted mb-0">Contact Information</p></div>

            <div class="col-md-6">
              <label class="form-label small fw-medium required-mark">Email</label>
              <input type="email" class="form-control form-control-sm" formControlName="email"
                     [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched" />
              <div class="invalid-feedback">Valid email is required.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-medium">Phone</label>
              <input type="text" class="form-control form-control-sm" formControlName="phone" />
            </div>
            <div class="col-12">
              <label class="form-label small fw-medium">Address</label>
              <input type="text" class="form-control form-control-sm" formControlName="address" />
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-medium">City</label>
              <input type="text" class="form-control form-control-sm" formControlName="city" />
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-medium">State</label>
              <input type="text" class="form-control form-control-sm" formControlName="state" />
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-medium">PIN / Zip Code</label>
              <input type="text" class="form-control form-control-sm" formControlName="pinCode" />
            </div>
          </div>
        </form>
      </div>
      <div class="card-footer bg-transparent d-flex justify-content-end gap-2">
        <button class="btn btn-outline-secondary btn-sm" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary btn-sm" (click)="save()" [disabled]="saving()">
          @if (saving()) { <span class="spinner-border spinner-border-sm me-1"></span> }
          Save Party
        </button>
      </div>
    </div>
  }
</div>
