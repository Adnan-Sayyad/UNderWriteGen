<div class="page-container">
  <app-page-header
    title="Risk & Evidence"
    subtitle="Look up risk profiles and supporting evidence by submission"
    icon="bi-shield-check"
    [breadcrumbs]="breadcrumbs">
  </app-page-header>

  <div class="row g-4 justify-content-center mt-2">
    <!-- Search Card -->
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold">
          <i class="bi bi-search me-2 text-primary"></i>Look Up by Submission
        </div>
        <div class="card-body">
          <form [formGroup]="form" novalidate>
            <label class="form-label small fw-medium">Submission ID</label>
            <input type="text" class="form-control form-control-sm mb-3"
                   placeholder="Paste a submission UUID…"
                   formControlName="submissionId"
                   [class.is-invalid]="form.controls.submissionId.invalid && form.controls.submissionId.touched" />
            <div class="invalid-feedback mb-2">Submission ID is required.</div>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-primary flex-fill" (click)="goProfile()">
                <i class="bi bi-shield-check me-1"></i>Risk Profile
              </button>
              <button class="btn btn-sm btn-outline-primary flex-fill" (click)="goEvidence()">
                <i class="bi bi-file-earmark-medical me-1"></i>Evidence
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Info Cards -->
    <div class="col-md-6">
      <div class="row g-3">
        <div class="col-12">
          <div class="card border-0 bg-light">
            <div class="card-body d-flex align-items-start gap-3">
              <div class="fs-3 text-primary"><i class="bi bi-shield-check"></i></div>
              <div>
                <div class="fw-semibold small">Risk Profile</div>
                <div class="text-muted small">View and update the risk type, attributes, and underwriter notes for any submission.</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="card border-0 bg-light">
            <div class="card-body d-flex align-items-start gap-3">
              <div class="fs-3 text-success"><i class="bi bi-file-earmark-medical"></i></div>
              <div>
                <div class="fw-semibold small">Evidence & References</div>
                <div class="text-muted small">Track inspection reports, medical records, lab results, telematics, claims history, and sanctions checks.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
