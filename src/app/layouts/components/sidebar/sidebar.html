<nav class="sidebar d-flex flex-column" style="width:var(--sidebar-width); background:var(--sidebar-bg); height:100vh; position:fixed; top:0; left:0; z-index:1030; overflow-y:auto;">
  <!-- Brand -->
  <div class="px-3 py-3 border-bottom border-opacity-25 border-white">
    <span class="fw-bold text-white fs-5">
      <i class="bi bi-shield-lock me-2"></i>UnderwritePro
    </span>
  </div>

  <!-- User chip -->
  @if (user()) {
    <div class="px-3 py-2 border-bottom border-opacity-25 border-white">
      <small class="d-block text-truncate" style="color:var(--sidebar-text)">{{ user()!.name }}</small>
      <small style="color:#7ba3cc; font-size:.7rem">{{ user()!.role }}</small>
    </div>
  }

  <!-- Nav -->
  <div class="sidebar-nav flex-grow-1 px-2 py-2">
    @for (group of visibleGroups(); track group.title) {
      <div class="nav-group-title">{{ group.title }}</div>
      @for (item of group.items; track item.route) {
        <a class="nav-link d-flex align-items-center gap-2 mb-1"
           [routerLink]="item.route" routerLinkActive="active">
          <i class="bi {{ item.icon }}"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    }
  </div>

  <!-- Logout -->
  <div class="px-2 py-3 border-top border-opacity-25 border-white">
    <button class="btn btn-sm w-100 text-start" style="color:var(--sidebar-text)"
            (click)="auth.logout()">
      <i class="bi bi-box-arrow-left me-2"></i>Logout
    </button>
  </div>
</nav>
