<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm"
     style="height:var(--navbar-height); position:fixed; top:0; left:var(--sidebar-width); right:0; z-index:1020; padding: 0 1.25rem;">

  <span class="navbar-brand fw-semibold text-primary fs-6 mb-0 h1"></span>

  <div class="ms-auto d-flex align-items-center gap-3">
    <!-- Notifications bell -->
    <a routerLink="/notifications" class="btn btn-sm btn-outline-secondary position-relative" title="Notifications">
      <i class="bi bi-bell"></i>
      @if (unreadCount() > 0) {
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:.6rem">
          {{ unreadCount() > 99 ? '99+' : unreadCount() }}
        </span>
      }
    </a>

    <!-- User dropdown -->
    @if (user()) {
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle me-1"></i>{{ user()!.name }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
          <li><a class="dropdown-item" routerLink="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger" (click)="auth.logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
        </ul>
      </div>
    }
  </div>
</nav>
